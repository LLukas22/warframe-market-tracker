[package]
name = "wfmt-scraper"
description = "The server's background scraper: fetches warframe.market riven auctions, normalizes the rolls and stores them as parquet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wfmt-types.workspace = true
wfmt-model.workspace = true
wfmt-dataset = { workspace = true, features = ["clap"] }
anyhow.workspace = true
arrow.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2.workspace = true
parquet.workspace = true
reqwest = { workspace = true, features = ["json", "gzip"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing.workspace = true

# Logging for the `reprocess` tool.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
# The `reprocess` tool, see src/bin/reprocess.rs.
reprocess = ["dep:tracing-subscriber"]

[[bin]]
name = "reprocess"
required-features = ["reprocess"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
