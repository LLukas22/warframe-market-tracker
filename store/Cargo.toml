[package]
name = "wfmt-store"
description = "The server's read model: the dataset in memory, indexed to answer the web UI's searches and riven pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
wfmt-types.workspace = true
wfmt-api.workspace = true
wfmt-model.workspace = true
wfmt-dataset.workspace = true
anyhow.workspace = true
arrow.workspace = true
parquet.workspace = true
# Fast hashing for the in-memory indexes; keys are ids from our own dataset.
rustc-hash = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
# Benchmarks on the real dataset, see benches/queries.rs.
divan = "0.1"
# Snapshots of the query answers, see tests/snapshots.rs.
insta = { version = "1", features = ["json"] }
# Tests write their data the way the scraper does.
wfmt-scraper.workspace = true
chrono.workspace = true
flate2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "queries"
harness = false
