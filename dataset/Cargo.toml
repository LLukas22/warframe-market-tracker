[package]
name = "wfmt-dataset"
description = "The dataset on disk: layout, parquet schema, transactional writes, compaction and the riven identity registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Command line and environment flags for the maintenance settings.
clap = ["dep:clap"]

[dependencies]
wfmt-types.workspace = true
anyhow.workspace = true
arrow.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
parquet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
