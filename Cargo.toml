[package]
name = "warframe-market-tracker"
version = "0.1.0"
edition = "2024"
description = "Web app for browsing warframe.market riven auctions, which it scrapes in the background."
license = "MIT"
repository = "https://github.com/LLukas22/warframe-market-tracker"

[workspace]
members = ["ocr", "scraper", "types"]

[dependencies]
anyhow = "1"
wfmt-types = { path = "types" }
wfmt-scraper = { path = "scraper", optional = true }
gloo-timers = { version = "0.3", features = ["futures"] }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }

# Server only
tower-http = { version = "0.6", features = ["compression-gzip"], optional = true }
arrow = { version = "60", default-features = false, optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "time", "io-util"], optional = true }
reqwest = { version = "0.13", optional = true }
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
hf-hub = { version = "1", optional = true }
# Fast hashing for the in-memory indexes; keys are ids from our own dataset.
rustc-hash = { version = "2", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dep:tower-http", "dep:wfmt-scraper", "dioxus/server", "dep:arrow", "dep:parquet", "dep:tokio", "dep:reqwest", "dep:serde_json", "dep:chrono", "dep:flate2", "dep:futures-util", "dep:tar", "dep:tokio-util", "dep:hf-hub", "dep:rustc-hash"]

# Must match the installed wasm-bindgen CLI (`wasm-bindgen --version`), dx refuses mismatches.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dev-dependencies]
flate2 = "1"

# The OCR module's browser build (ocr/scripts/build-web.sh). Inference is slow without full
# optimization, and the module is downloaded separately, so size and speed both matter.
[profile.ocr-wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The browser build (see the Dockerfile): download size dominates first load, and the client
# does little computation, so optimize for size. The server keeps the plain release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
